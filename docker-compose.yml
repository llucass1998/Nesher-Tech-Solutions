services:
  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  identity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:-identity}
      POSTGRES_USER: ${IDENTITY_DB_USER:-identity}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}
    ports:
      - "${IDENTITY_DB_PORT:-5437}:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  identity-migrate:
    build:
      context: .
      dockerfile: Dockerfile.identity-api
    command: ["npx", "prisma", "migrate", "deploy", "--config", "apps/identity-api/prisma.config.ts"]
    environment:
      NODE_ENV: production
      IDENTITY_DATABASE_URL: postgresql://${IDENTITY_DB_USER:-identity}:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}@identity-db:5432/${IDENTITY_DB_NAME:-identity}?schema=public
    depends_on:
      identity-db:
        condition: service_healthy
    restart: "no"

  identity-api:
    build:
      context: .
      dockerfile: Dockerfile.identity-api
    environment:
      NODE_ENV: production
      IDENTITY_PORT: 3633
      IDENTITY_DATABASE_URL: postgresql://${IDENTITY_DB_USER:-identity}:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}@identity-db:5432/${IDENTITY_DB_NAME:-identity}?schema=public
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-logiidentity}
      IDENTITY_JWT_KID: ${IDENTITY_JWT_KID:-identity-local-dev}
      IDENTITY_JWT_PRIVATE_KEY: ${IDENTITY_JWT_PRIVATE_KEY:-}
      IDENTITY_JWT_PUBLIC_KEY: ${IDENTITY_JWT_PUBLIC_KEY:-}
      IDENTITY_WEB_ORIGIN: ${IDENTITY_WEB_ORIGIN:-http://localhost:3500,http://localhost:3000}
      REDIS_URL: redis://redis:6379
    depends_on:
      identity-db:
        condition: service_healthy
      identity-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${IDENTITY_API_PORT:-3633}:3633"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3633/api/v1/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  identity-worker:
    build:
      context: .
      dockerfile: Dockerfile.workspace-worker
      args:
        WORKSPACE: identity-worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      identity-api:
        condition: service_healthy
    restart: unless-stopped

  logiflow-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LOGIFLOW_DB_NAME:-logiflow}
      POSTGRES_USER: ${LOGIFLOW_DB_USER:-logiflow}
      POSTGRES_PASSWORD: ${LOGIFLOW_DB_PASSWORD:?set LOGIFLOW_DB_PASSWORD}
    ports:
      - "${LOGIFLOW_DB_PORT:-5432}:5432"
    volumes:
      - logiflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logiflow-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 3333
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${LOGIFLOW_DB_USER:-logiflow}:${LOGIFLOW_DB_PASSWORD:?set LOGIFLOW_DB_PASSWORD}@logiflow-db:5432/${LOGIFLOW_DB_NAME:-logiflow}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-logiflow-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-logiflow,logidesk}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      PAYMENTS_API_KEY: ${PAYMENTS_API_KEY:?set PAYMENTS_API_KEY}
      LOGIDESK_API_URL: ${LOGIDESK_API_URL:-http://logidesk-api:3533/api/v1}
      LOGIDESK_SERVICE_TOKEN: ${LOGIDESK_SERVICE_TOKEN:?set LOGIDESK_SERVICE_TOKEN}
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-http://identity-api:3633/.well-known/jwks.json}
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-logiidentity}
      IDENTITY_AUDIENCE: ${IDENTITY_LOGIFLOW_AUDIENCE:-logiflow}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      logiflow-db:
        condition: service_healthy
      logiflow-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      identity-api:
        condition: service_healthy
    ports:
      - "${LOGIFLOW_API_PORT:-3333}:3333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/api/v1/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logiflow-migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${LOGIFLOW_DB_USER:-logiflow}:${LOGIFLOW_DB_PASSWORD:?set LOGIFLOW_DB_PASSWORD}@logiflow-db:5432/${LOGIFLOW_DB_NAME:-logiflow}?schema=public
    depends_on:
      logiflow-db:
        condition: service_healthy
    restart: "no"

  logiflow-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    depends_on:
      logiflow-api:
        condition: service_healthy
    ports:
      - "${LOGIFLOW_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logiflow-worker:
    build:
      context: .
      dockerfile: Dockerfile.workspace-worker
      args:
        WORKSPACE: logiflow-worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${LOGIFLOW_DB_USER:-logiflow}:${LOGIFLOW_DB_PASSWORD:?set LOGIFLOW_DB_PASSWORD}@logiflow-db:5432/${LOGIFLOW_DB_NAME:-logiflow}?schema=public
      LOGIDESK_API_URL: ${LOGIDESK_API_URL:-http://logidesk-api:3533/api/v1}
      LOGIDESK_SERVICE_TOKEN: ${LOGIDESK_SERVICE_TOKEN:?set LOGIDESK_SERVICE_TOKEN}
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-http://identity-api:3633/.well-known/jwks.json}
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-logiidentity}
      IDENTITY_AUDIENCE: ${IDENTITY_LOGIFLOW_AUDIENCE:-logiflow}
      LOGIFLOW_OUTBOX_POLL_INTERVAL_MS: ${LOGIFLOW_OUTBOX_POLL_INTERVAL_MS:-5000}
      LOGIFLOW_OUTBOX_MAX_ATTEMPTS: ${LOGIFLOW_OUTBOX_MAX_ATTEMPTS:-5}
      LOGIFLOW_OUTBOX_RETRY_BASE_DELAY_SECONDS: ${LOGIFLOW_OUTBOX_RETRY_BASE_DELAY_SECONDS:-30}
      LOGIFLOW_OUTBOX_RETRY_MAX_DELAY_SECONDS: ${LOGIFLOW_OUTBOX_RETRY_MAX_DELAY_SECONDS:-900}
      LOGIFLOW_EVENT_STREAM: ${LOGIFLOW_EVENT_STREAM:-logiflow.events}
      EVENT_STREAM_MAXLEN: ${EVENT_STREAM_MAXLEN:-10000}
    depends_on:
      redis:
        condition: service_healthy
      logiflow-api:
        condition: service_healthy
      logidesk-api:
        condition: service_healthy
      identity-api:
        condition: service_healthy
    restart: unless-stopped

  logidesk-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LOGIDESK_DB_NAME:-logidesk}
      POSTGRES_USER: ${LOGIDESK_DB_USER:-logidesk}
      POSTGRES_PASSWORD: ${LOGIDESK_DB_PASSWORD:?set LOGIDESK_DB_PASSWORD}
    ports:
      - "${LOGIDESK_DB_PORT:-5434}:5432"
    volumes:
      - logidesk-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logidesk-migrate:
    build:
      context: .
      dockerfile: Dockerfile.logidesk-api
    command: ["npx", "prisma", "migrate", "deploy", "--config", "apps/logidesk-api/prisma.config.ts"]
    environment:
      NODE_ENV: production
      LOGIDESK_DATABASE_URL: postgresql://${LOGIDESK_DB_USER:-logidesk}:${LOGIDESK_DB_PASSWORD:?set LOGIDESK_DB_PASSWORD}@logidesk-db:5432/${LOGIDESK_DB_NAME:-logidesk}?schema=public
    depends_on:
      logidesk-db:
        condition: service_healthy
    restart: "no"

  logidesk-api:
    build:
      context: .
      dockerfile: Dockerfile.logidesk-api
    environment:
      NODE_ENV: production
      LOGIDESK_PORT: 3533
      LOGIDESK_WEB_ORIGIN: ${LOGIDESK_WEB_ORIGIN:-http://localhost:3500}
      LOGIDESK_DATABASE_URL: postgresql://${LOGIDESK_DB_USER:-logidesk}:${LOGIDESK_DB_PASSWORD:?set LOGIDESK_DB_PASSWORD}@logidesk-db:5432/${LOGIDESK_DB_NAME:-logidesk}?schema=public
      LOGIDESK_SERVICE_TOKEN: ${LOGIDESK_SERVICE_TOKEN:?set LOGIDESK_SERVICE_TOKEN}
      LOGIDESK_REQUIRE_REST_AUTH: ${LOGIDESK_REQUIRE_REST_AUTH:-true}
      REDIS_URL: redis://redis:6379
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-http://identity-api:3633/.well-known/jwks.json}
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-logiidentity}
      IDENTITY_AUDIENCE: ${IDENTITY_LOGIDESK_AUDIENCE:-logidesk}
    depends_on:
      logidesk-db:
        condition: service_healthy
      logidesk-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      identity-api:
        condition: service_healthy
    ports:
      - "${LOGIDESK_API_PORT:-3533}:3533"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3533/api/v1/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logidesk-worker:
    build:
      context: .
      dockerfile: Dockerfile.workspace-worker
      args:
        WORKSPACE: logidesk-worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      LOGIDESK_DATABASE_URL: postgresql://${LOGIDESK_DB_USER:-logidesk}:${LOGIDESK_DB_PASSWORD:?set LOGIDESK_DB_PASSWORD}@logidesk-db:5432/${LOGIDESK_DB_NAME:-logidesk}?schema=public
      LOGIFLOW_API_URL: ${LOGIFLOW_API_URL:-http://logiflow-api:3333/api/v1}
      LOGIDESK_SERVICE_TOKEN: ${LOGIDESK_SERVICE_TOKEN:?set LOGIDESK_SERVICE_TOKEN}
      LOGIDESK_OUTBOX_POLL_INTERVAL_MS: ${LOGIDESK_OUTBOX_POLL_INTERVAL_MS:-5000}
      LOGIDESK_OUTBOX_MAX_ATTEMPTS: ${LOGIDESK_OUTBOX_MAX_ATTEMPTS:-5}
      LOGIDESK_OUTBOX_RETRY_BASE_DELAY_SECONDS: ${LOGIDESK_OUTBOX_RETRY_BASE_DELAY_SECONDS:-30}
      LOGIDESK_OUTBOX_RETRY_MAX_DELAY_SECONDS: ${LOGIDESK_OUTBOX_RETRY_MAX_DELAY_SECONDS:-900}
      LOGIDESK_EVENT_STREAM: ${LOGIDESK_EVENT_STREAM:-logidesk.events}
      EVENT_STREAM_MAXLEN: ${EVENT_STREAM_MAXLEN:-10000}
    depends_on:
      redis:
        condition: service_healthy
      logidesk-api:
        condition: service_healthy
    restart: unless-stopped

  logidesk-web:
    build:
      context: .
      dockerfile: Dockerfile.logidesk-web
      args:
        NEXT_PUBLIC_LOGIDESK_API_URL: ${NEXT_PUBLIC_LOGIDESK_API_URL:-http://localhost:3533/api/v1}
        NEXT_PUBLIC_IDENTITY_API_URL: ${NEXT_PUBLIC_IDENTITY_API_URL:-http://localhost:3633}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_LOGIDESK_API_URL: ${NEXT_PUBLIC_LOGIDESK_API_URL:-http://localhost:3533/api/v1}
      NEXT_PUBLIC_IDENTITY_API_URL: ${NEXT_PUBLIC_IDENTITY_API_URL:-http://localhost:3633}
    depends_on:
      logidesk-api:
        condition: service_healthy
    ports:
      - "${LOGIDESK_WEB_PORT:-3500}:3500"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3500 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logipeople-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LOGIPEOPLE_DB_NAME:-logipeople}
      POSTGRES_USER: ${LOGIPEOPLE_DB_USER:-logipeople}
      POSTGRES_PASSWORD: ${LOGIPEOPLE_DB_PASSWORD:?set LOGIPEOPLE_DB_PASSWORD}
    ports:
      - "${LOGIPEOPLE_DB_PORT:-5439}:5432"
    volumes:
      - logipeople-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logipeople-migrate:
    build:
      context: .
      dockerfile: Dockerfile.logipeople-api
    command: ["npx", "prisma", "migrate", "deploy", "--config", "apps/logipeople-api/prisma.config.ts"]
    environment:
      NODE_ENV: production
      LOGIPEOPLE_DATABASE_URL: postgresql://${LOGIPEOPLE_DB_USER:-logipeople}:${LOGIPEOPLE_DB_PASSWORD:?set LOGIPEOPLE_DB_PASSWORD}@logipeople-db:5432/${LOGIPEOPLE_DB_NAME:-logipeople}?schema=public
    depends_on:
      logipeople-db:
        condition: service_healthy
    restart: "no"

  logipeople-api:
    build:
      context: .
      dockerfile: Dockerfile.logipeople-api
    environment:
      NODE_ENV: production
      LOGIPEOPLE_PORT: 3433
      LOGIPEOPLE_WEB_ORIGIN: ${LOGIPEOPLE_WEB_ORIGIN:-http://localhost:3400}
      LOGIPEOPLE_DATABASE_URL: postgresql://${LOGIPEOPLE_DB_USER:-logipeople}:${LOGIPEOPLE_DB_PASSWORD:?set LOGIPEOPLE_DB_PASSWORD}@logipeople-db:5432/${LOGIPEOPLE_DB_NAME:-logipeople}?schema=public
      REDIS_URL: redis://redis:6379
      LOGIIDENTITY_ISSUER: ${LOGIIDENTITY_ISSUER:-logiidentity.local}
      LOGIIDENTITY_AUDIENCE: ${LOGIIDENTITY_AUDIENCE:-logipeople}
      LOGIIDENTITY_JWT_SECRET: ${LOGIIDENTITY_JWT_SECRET:?set LOGIIDENTITY_JWT_SECRET}
    depends_on:
      logipeople-db:
        condition: service_healthy
      logipeople-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${LOGIPEOPLE_API_PORT:-3433}:3433"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3433/api/v1/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logipeople-worker:
    build:
      context: .
      dockerfile: Dockerfile.workspace-worker
      args:
        WORKSPACE: logipeople-worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      LOGIPEOPLE_DATABASE_URL: postgresql://${LOGIPEOPLE_DB_USER:-logipeople}:${LOGIPEOPLE_DB_PASSWORD:?set LOGIPEOPLE_DB_PASSWORD}@logipeople-db:5432/${LOGIPEOPLE_DB_NAME:-logipeople}?schema=public
      LOGIPEOPLE_OUTBOX_POLL_INTERVAL_MS: ${LOGIPEOPLE_OUTBOX_POLL_INTERVAL_MS:-5000}
      LOGIPEOPLE_OUTBOX_MAX_ATTEMPTS: ${LOGIPEOPLE_OUTBOX_MAX_ATTEMPTS:-5}
      LOGIPEOPLE_OUTBOX_RETRY_BASE_DELAY_SECONDS: ${LOGIPEOPLE_OUTBOX_RETRY_BASE_DELAY_SECONDS:-30}
      LOGIPEOPLE_OUTBOX_RETRY_MAX_DELAY_SECONDS: ${LOGIPEOPLE_OUTBOX_RETRY_MAX_DELAY_SECONDS:-900}
      LOGIPEOPLE_EVENT_STREAM: ${LOGIPEOPLE_EVENT_STREAM:-logipeople.events}
      EVENT_STREAM_MAXLEN: ${EVENT_STREAM_MAXLEN:-10000}
    depends_on:
      redis:
        condition: service_healthy
      logipeople-api:
        condition: service_healthy
    restart: unless-stopped

  logipeople-web:
    build:
      context: .
      dockerfile: Dockerfile.logipeople-web
      args:
        NEXT_PUBLIC_LOGIPEOPLE_API_URL: ${NEXT_PUBLIC_LOGIPEOPLE_API_URL:-http://localhost:3433/api/v1}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_LOGIPEOPLE_API_URL: ${NEXT_PUBLIC_LOGIPEOPLE_API_URL:-http://localhost:3433/api/v1}
    depends_on:
      logipeople-api:
        condition: service_healthy
    ports:
      - "${LOGIPEOPLE_WEB_PORT:-3400}:3400"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3400 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logipayroll-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LOGIPAYROLL_DB_NAME:-logipayroll}
      POSTGRES_USER: ${LOGIPAYROLL_DB_USER:-logipayroll}
      POSTGRES_PASSWORD: ${LOGIPAYROLL_DB_PASSWORD:?set LOGIPAYROLL_DB_PASSWORD}
    ports:
      - "${LOGIPAYROLL_DB_PORT:-5438}:5432"
    volumes:
      - logipayroll-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logipayroll-migrate:
    build:
      context: .
      dockerfile: Dockerfile.logipayroll-api
    command: ["npx", "prisma", "migrate", "deploy", "--config", "apps/logipayroll-api/prisma.config.ts"]
    environment:
      NODE_ENV: production
      LOGIPAYROLL_DATABASE_URL: postgresql://${LOGIPAYROLL_DB_USER:-logipayroll}:${LOGIPAYROLL_DB_PASSWORD:?set LOGIPAYROLL_DB_PASSWORD}@logipayroll-db:5432/${LOGIPAYROLL_DB_NAME:-logipayroll}?schema=public
    depends_on:
      logipayroll-db:
        condition: service_healthy
    restart: "no"

  logipayroll-api:
    build:
      context: .
      dockerfile: Dockerfile.logipayroll-api
    environment:
      NODE_ENV: production
      LOGIPAYROLL_PORT: 3733
      LOGIPAYROLL_WEB_ORIGIN: ${LOGIPAYROLL_WEB_ORIGIN:-http://localhost:3600}
      LOGIPAYROLL_DATABASE_URL: postgresql://${LOGIPAYROLL_DB_USER:-logipayroll}:${LOGIPAYROLL_DB_PASSWORD:?set LOGIPAYROLL_DB_PASSWORD}@logipayroll-db:5432/${LOGIPAYROLL_DB_NAME:-logipayroll}?schema=public
      REDIS_URL: redis://redis:6379
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-http://identity-api:3633/.well-known/jwks.json}
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-logiidentity}
      IDENTITY_AUDIENCE: ${IDENTITY_LOGIPAYROLL_AUDIENCE:-logipayroll}
    depends_on:
      logipayroll-db:
        condition: service_healthy
      logipayroll-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      identity-api:
        condition: service_healthy
    ports:
      - "${LOGIPAYROLL_API_PORT:-3733}:3733"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3733/api/v1/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logipayroll-worker:
    build:
      context: .
      dockerfile: Dockerfile.workspace-worker
      args:
        WORKSPACE: logipayroll-worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      LOGIPAYROLL_DATABASE_URL: postgresql://${LOGIPAYROLL_DB_USER:-logipayroll}:${LOGIPAYROLL_DB_PASSWORD:?set LOGIPAYROLL_DB_PASSWORD}@logipayroll-db:5432/${LOGIPAYROLL_DB_NAME:-logipayroll}?schema=public
      LOGIPAYROLL_OUTBOX_POLL_INTERVAL_MS: ${LOGIPAYROLL_OUTBOX_POLL_INTERVAL_MS:-5000}
      LOGIPAYROLL_OUTBOX_MAX_ATTEMPTS: ${LOGIPAYROLL_OUTBOX_MAX_ATTEMPTS:-5}
      LOGIPAYROLL_OUTBOX_RETRY_BASE_DELAY_SECONDS: ${LOGIPAYROLL_OUTBOX_RETRY_BASE_DELAY_SECONDS:-30}
      LOGIPAYROLL_OUTBOX_RETRY_MAX_DELAY_SECONDS: ${LOGIPAYROLL_OUTBOX_RETRY_MAX_DELAY_SECONDS:-900}
      LOGIPAYROLL_EVENT_STREAM: ${LOGIPAYROLL_EVENT_STREAM:-logipayroll.events}
      LOGIPEOPLE_EVENT_STREAM: ${LOGIPEOPLE_EVENT_STREAM:-logipeople.events}
      LOGIPAYROLL_LOGIPEOPLE_CONSUMER_BATCH_SIZE: ${LOGIPAYROLL_LOGIPEOPLE_CONSUMER_BATCH_SIZE:-10}
      LOGIPAYROLL_LOGIPEOPLE_CONSUMER_BLOCK_MS: ${LOGIPAYROLL_LOGIPEOPLE_CONSUMER_BLOCK_MS:-100}
      EVENT_STREAM_MAXLEN: ${EVENT_STREAM_MAXLEN:-10000}
    depends_on:
      redis:
        condition: service_healthy
      logipayroll-api:
        condition: service_healthy
    restart: unless-stopped

  logipayroll-web:
    build:
      context: .
      dockerfile: Dockerfile.logipayroll-web
      args:
        NEXT_PUBLIC_LOGIPAYROLL_API_URL: ${NEXT_PUBLIC_LOGIPAYROLL_API_URL:-http://localhost:3733/api/v1}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_LOGIPAYROLL_API_URL: ${NEXT_PUBLIC_LOGIPAYROLL_API_URL:-http://localhost:3733/api/v1}
    depends_on:
      logipayroll-api:
        condition: service_healthy
    ports:
      - "${LOGIPAYROLL_WEB_PORT:-3600}:3600"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3600 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  identity-db-data:
  logiflow-db-data:
  logidesk-db-data:
  logipeople-db-data:
  logipayroll-db-data:
