name: LogiIdentity CI

on:
  pull_request:
    paths:
      - ".github/workflows/identity-ci.yml"
      - "apps/identity-api/**"
      - "apps/identity-worker/**"
      - "databases/identity/**"
      - "packages/auth/**"
      - "packages/logger/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/identity-ci.yml"
      - "apps/identity-api/**"
      - "apps/identity-worker/**"
      - "databases/identity/**"
      - "packages/auth/**"
      - "packages/logger/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"

concurrency:
  group: identity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: identity checks
    runs-on: ubuntu-latest
    env:
      IDENTITY_DATABASE_URL: postgresql://identity:identity@localhost:5438/identity?schema=public
      IDENTITY_ISSUER: logiidentity
      IDENTITY_AUDIENCE: logiflow,logidesk
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i -g pnpm
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run identity:prisma:generate
      - run: pnpm run typecheck -w identity-api
      - run: pnpm run typecheck -w identity-worker
      - run: pnpm run test -w identity-api
      - run: pnpm run build -w identity-api
      - run: pnpm run build -w identity-worker
      - run: pnpm audit
