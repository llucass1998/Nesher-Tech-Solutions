name: LogiDesk CI

on:
  pull_request:
    paths:
      - ".github/workflows/logidesk-ci.yml"
      - "apps/logidesk-api/**"
      - "apps/logidesk-web/**"
      - "apps/logidesk-worker/**"
      - "databases/logidesk/**"
      - "packages/auth/**"
      - "packages/event-contracts/**"
      - "packages/logger/**"
      - "packages/eslint-config/**"
      - "packages/typescript-config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/logidesk-ci.yml"
      - "apps/logidesk-api/**"
      - "apps/logidesk-web/**"
      - "apps/logidesk-worker/**"
      - "databases/logidesk/**"
      - "packages/auth/**"
      - "packages/event-contracts/**"
      - "packages/logger/**"
      - "packages/eslint-config/**"
      - "packages/typescript-config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"

concurrency:
  group: logidesk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: workspace checks
    runs-on: ubuntu-latest
    env:
      LOGIDESK_DATABASE_URL: postgresql://logidesk:logidesk@localhost:5434/logidesk?schema=public
      LOGIDESK_SERVICE_TOKEN: ci-service-token
      LOGIDESK_WEB_ORIGIN: http://localhost:3500
      IDENTITY_JWKS_URL: http://localhost:3633/.well-known/jwks.json
      IDENTITY_ISSUER: logiidentity
      IDENTITY_AUDIENCE: logidesk
      NEXT_PUBLIC_LOGIDESK_API_URL: http://localhost:3533/api/v1
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i -g pnpm
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run logidesk:prisma:generate
      - run: pnpm run lint:workspaces
      - run: pnpm run typecheck
      - run: pnpm run test:workspaces
      - run: pnpm run build:workspaces
      - run: pnpm audit
