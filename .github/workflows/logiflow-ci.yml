name: LogiFlow CI

on:
  pull_request:
    paths:
      - ".github/workflows/logiflow-ci.yml"
      - ".dockerignore"
      - "Dockerfile.api"
      - "Dockerfile.web"
      - "docker-compose.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "public/**"
      - "src/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/logiflow-ci.yml"
      - ".dockerignore"
      - "Dockerfile.api"
      - "Dockerfile.web"
      - "docker-compose.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "public/**"
      - "src/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"

concurrency:
  group: logiflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm audit

  docker:
    name: docker build and smoke
    runs-on: ubuntu-latest
    needs: verify
    env:
      LOGIFLOW_DB_NAME: logiflow
      LOGIFLOW_DB_USER: logiflow
      LOGIFLOW_DB_PASSWORD: ci-logiflow-password
      LOGIFLOW_DB_PORT: 55432
      LOGIFLOW_API_PORT: 3335
      LOGIFLOW_WEB_PORT: 3005
      IDENTITY_DB_NAME: identity
      IDENTITY_DB_USER: identity
      IDENTITY_DB_PASSWORD: ci-identity-password
      IDENTITY_DB_PORT: 55435
      IDENTITY_API_PORT: 3635
      IDENTITY_DATABASE_URL: postgresql://identity:ci-identity-password@localhost:55435/identity?schema=public
      IDENTITY_ISSUER: logiidentity
      IDENTITY_AUDIENCE: logiflow,logidesk
      IDENTITY_JWKS_URL: http://localhost:3635/.well-known/jwks.json
      WEB_ORIGIN: http://localhost:3005
      NEXT_PUBLIC_API_URL: http://localhost:3335
      JWT_SECRET: ci-jwt-secret
      JWT_ISSUER: logiflow-identity
      JWT_AUDIENCE: logiflow,logidesk
      PAYMENTS_API_KEY: ci-payments-key
      LOGIDESK_DB_NAME: logidesk
      LOGIDESK_DB_USER: logidesk
      LOGIDESK_DB_PASSWORD: ci-logidesk-password
      LOGIDESK_DB_PORT: 55434
      LOGIDESK_API_PORT: 3535
      LOGIDESK_WEB_PORT: 3505
      LOGIDESK_DATABASE_URL: postgresql://logidesk:ci-logidesk-password@localhost:55434/logidesk?schema=public
      LOGIDESK_SERVICE_TOKEN: ci-service-token
      LOGIDESK_API_URL: http://localhost:3535/api/v1
      NEXT_PUBLIC_LOGIDESK_API_URL: http://localhost:3535/api/v1
      REDIS_PORT: 56379
      REDIS_URL: redis://localhost:56379
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 7
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build identity-migrate identity-api identity-worker logiflow-migrate logiflow-api logiflow-web logiflow-worker logidesk-migrate logidesk-api logidesk-web logidesk-worker
      - run: docker compose up -d
      - name: Wait for health checks
        run: |
          for i in $(seq 1 30); do
            api_container="$(docker compose ps -q logiflow-api)"
            web_container="$(docker compose ps -q logiflow-web)"
            db_container="$(docker compose ps -q logiflow-db)"
            desk_api_container="$(docker compose ps -q logidesk-api)"
            desk_web_container="$(docker compose ps -q logidesk-web)"
            desk_db_container="$(docker compose ps -q logidesk-db)"
            api_status="$(docker inspect --format='{{.State.Health.Status}}' "$api_container" 2>/dev/null || true)"
            web_status="$(docker inspect --format='{{.State.Health.Status}}' "$web_container" 2>/dev/null || true)"
            db_status="$(docker inspect --format='{{.State.Health.Status}}' "$db_container" 2>/dev/null || true)"
            desk_api_status="$(docker inspect --format='{{.State.Health.Status}}' "$desk_api_container" 2>/dev/null || true)"
            desk_web_status="$(docker inspect --format='{{.State.Health.Status}}' "$desk_web_container" 2>/dev/null || true)"
            desk_db_status="$(docker inspect --format='{{.State.Health.Status}}' "$desk_db_container" 2>/dev/null || true)"
            if [ "$api_status" = "healthy" ] && [ "$web_status" = "healthy" ] && [ "$db_status" = "healthy" ] && [ "$desk_api_status" = "healthy" ] && [ "$desk_web_status" = "healthy" ] && [ "$desk_db_status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1
      - run: curl -fsS http://localhost:3335/api/v1/health/live
      - run: curl -fsS http://localhost:3335/api/v1/health/ready
      - run: curl -fsS http://localhost:3005
      - run: curl -fsS http://localhost:3535/api/v1/health/live
      - run: curl -fsS http://localhost:3535/api/v1/health/ready
      - run: curl -fsS http://localhost:3505
      - name: Logs
        if: always()
        run: docker compose logs --tail=200
      - name: Down
        if: always()
        run: docker compose down -v
